name: Build and publish FilmCraft Web

on:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "Official FilmCraft release tag (empty = latest)"
        required: false
        type: string
      force_rebuild:
        description: "Rebuild an already published release"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "17 3 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-image.yml"
      - "Dockerfile"
      - "nginx.conf"
      - ".dockerignore"
      - "docker-compose.yml"

permissions:
  contents: write
  packages: write

concurrency:
  group: filmcraft-web-publish
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout packaging repository
        uses: actions/checkout@v4
        with:
          path: packaging

      - name: Validate versioned packaging files
        shell: bash
        run: |
          set -euo pipefail
          test -f packaging/Dockerfile
          test -f packaging/nginx.conf
          test -f packaging/.dockerignore
          test -f packaging/docker-compose.yml

      - name: Resolve official FilmCraft release
        id: upstream-release
        uses: actions/github-script@v7
        env:
          REQUESTED_TAG: ${{ inputs.upstream_tag }}
        with:
          script: |
            const requested = (process.env.REQUESTED_TAG || '').trim();
            const args = { owner: 'storytold', repo: 'filmcraft' };
            const { data: release } = requested
              ? await github.rest.repos.getReleaseByTag({ ...args, tag: requested })
              : await github.rest.repos.getLatestRelease(args);
            if (!release.tag_name) throw new Error('No upstream release tag found');
            core.setOutput('tag', release.tag_name);
            core.setOutput('url', release.html_url);
            core.setOutput('name', release.name || `FilmCraft ${release.tag_name}`);
            core.setOutput('prerelease', String(release.prerelease));
            core.setOutput('published_at', release.published_at || '');

      - name: Check existing MikaPST release
        id: release-check
        uses: actions/github-script@v7
        env:
          TAG: ${{ steps.upstream-release.outputs.tag }}
          FORCE_REBUILD: ${{ inputs.force_rebuild }}
          EVENT_NAME: ${{ github.event_name }}
        with:
          script: |
            let exists = false;
            try {
              await github.rest.repos.getReleaseByTag({ ...context.repo, tag: process.env.TAG });
              exists = true;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const forced = process.env.FORCE_REBUILD === 'true' || process.env.EVENT_NAME === 'push';
            core.setOutput('skip', String(exists && !forced));

      - name: Checkout official FilmCraft source
        if: steps.release-check.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: storytold/filmcraft
          ref: ${{ steps.upstream-release.outputs.tag }}
          path: upstream
          fetch-depth: 1

      - name: Checkout shared craft-fonts
        if: steps.release-check.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: storytold/craft-fonts
          ref: main
          path: craft-fonts
          fetch-depth: 1

      - name: Record upstream revisions
        if: steps.release-check.outputs.skip != 'true'
        id: source
        shell: bash
        run: |
          echo "filmcraft_sha=$(git -C upstream rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "filmcraft_short=$(git -C upstream rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          echo "craft_fonts_sha=$(git -C craft-fonts rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install Rust and WebAssembly target
        if: steps.release-check.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust build artifacts
        if: steps.release-check.outputs.skip != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "upstream -> upstream/target"

      - name: Install matching wasm-bindgen CLI
        if: steps.release-check.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          WASM_BINDGEN_VERSION="$(python3 - <<'PY'
          import tomllib
          from pathlib import Path
          lock = tomllib.loads(Path("upstream/Cargo.lock").read_text())
          versions = {p["version"] for p in lock["package"] if p["name"] == "wasm-bindgen"}
          if not versions:
              raise SystemExit("No wasm-bindgen package found in Cargo.lock")
          print(max(versions, key=lambda v: tuple(map(int, v.split("-")[0].split(".")))))
          PY
          )"
          cargo install wasm-bindgen-cli --version "${WASM_BINDGEN_VERSION}" --locked

      - name: Build official FilmCraft WebAssembly application
        if: steps.release-check.outputs.skip != 'true'
        shell: bash
        env:
          CARGO_BUILD_JOBS: "2"
          CRAFT_FONTS_REQUIRED: "1"
        run: |
          set -euo pipefail
          export CRAFT_FONTS_DIR="${GITHUB_WORKSPACE}/craft-fonts"
          cd upstream
          cargo xtask web

      - name: Prepare Docker build context
        if: steps.release-check.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -f upstream/target/web/dist/index.html
          test -n "$(find upstream/target/web/dist -type f -name '*.wasm' -print -quit)"
          mkdir -p docker-build/dist
          cp -a upstream/target/web/dist/. docker-build/dist/
          cp "${GITHUB_WORKSPACE}/packaging/nginx.conf" docker-build/nginx.conf
          cp "${GITHUB_WORKSPACE}/packaging/.dockerignore" docker-build/.dockerignore
          test -f docker-build/dist/index.html
          test -f docker-build/nginx.conf
          test -f docker-build/.dockerignore
          echo "Using versioned Dockerfile and NGINX configuration from packaging repository."

      - name: Set up QEMU
        if: steps.release-check.outputs.skip != 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.release-check.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: steps.release-check.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish multi-platform image
        if: steps.release-check.outputs.skip != 'true'
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./docker-build
          file: ./packaging/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            FILMCRAFT_COMMIT=${{ steps.source.outputs.filmcraft_sha }}
            CRAFT_FONTS_COMMIT=${{ steps.source.outputs.craft_fonts_sha }}
          tags: |
            ghcr.io/mikapst/filmcraft-web:latest
            ghcr.io/mikapst/filmcraft-web:${{ steps.upstream-release.outputs.tag }}
            ghcr.io/mikapst/filmcraft-web:upstream-${{ steps.source.outputs.filmcraft_short }}
          labels: |
            org.opencontainers.image.title=FilmCraft Web
            org.opencontainers.image.description=Community-maintained WebAssembly build of FilmCraft
            org.opencontainers.image.source=https://github.com/storytold/filmcraft
            org.opencontainers.image.version=${{ steps.upstream-release.outputs.tag }}
            org.opencontainers.image.revision=${{ steps.source.outputs.filmcraft_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create or update MikaPST GitHub Release
        if: steps.release-check.outputs.skip != 'true'
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ steps.upstream-release.outputs.tag }}
          RELEASE_NAME: ${{ steps.upstream-release.outputs.name }}
          RELEASE_URL: ${{ steps.upstream-release.outputs.url }}
          RELEASE_PUBLISHED_AT: ${{ steps.upstream-release.outputs.published_at }}
          RELEASE_PRERELEASE: ${{ steps.upstream-release.outputs.prerelease }}
          FILMCRAFT_SHA: ${{ steps.source.outputs.filmcraft_sha }}
          CRAFT_FONTS_SHA: ${{ steps.source.outputs.craft_fonts_sha }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            const image = 'ghcr.io/mikapst/filmcraft-web';
            const { data: upstream } = await github.rest.repos.getReleaseByTag({
              owner: 'storytold', repo: 'filmcraft', tag
            });
            const body = [
              `Community-maintained Docker packaging for **${process.env.RELEASE_NAME}**.`,
              '', '## Docker image',
              `- \`${image}:latest\``,
              `- \`${image}:${tag}\``,
              `- \`${image}:upstream-${process.env.FILMCRAFT_SHA.slice(0,12)}\``,
              '', 'Supported platforms: `linux/amd64`, `linux/arm64`.',
              '', '## Upstream project',
              `- Official release: ${process.env.RELEASE_URL}`,
              `- FilmCraft commit: \`${process.env.FILMCRAFT_SHA}\``,
              `- craft-fonts commit: \`${process.env.CRAFT_FONTS_SHA}\``,
              `- Upstream published: ${process.env.RELEASE_PUBLISHED_AT || 'not specified'}`,
              '', '## Upstream release notes',
              upstream.body || 'No release notes provided.',
              '', '## Image details',
              `- Image digest: \`${process.env.IMAGE_DIGEST}\``,
              '- Packaging: independently maintained by MikaPST, not an official FilmCraft release.'
            ].join('\n');
            let existing;
            try {
              ({ data: existing } = await github.rest.repos.getReleaseByTag({
                ...context.repo, tag
              }));
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const args = {
              ...context.repo,
              tag_name: tag,
              name: `FilmCraft Web ${tag}`,
              body,
              draft: false,
              prerelease: process.env.RELEASE_PRERELEASE === 'true'
            };
            if (existing) {
              await github.rest.repos.updateRelease({
                ...args, release_id: existing.id
              });
            } else {
              await github.rest.repos.createRelease({
                ...args, target_commitish: context.sha
              });
            }
